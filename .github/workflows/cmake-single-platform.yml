name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            sanitizer: ""
          - name: address+undefined
            sanitizer: "address,undefined"
          - name: thread
            sanitizer: "thread"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libgtest-dev

    - name: Configure
      run: cmake -B build -DLITTLE_CACHE_SANITIZER="${{ matrix.sanitizer }}"

    - name: Build
      run: cmake --build build -j

    - name: Test
      # ThreadSanitizer can't map its shadow memory with the runner kernel's address randomisation, so it runs
      # with randomisation turned off for the test process.
      run: |
        if [ "${{ matrix.sanitizer }}" = "thread" ]; then
          setarch "$(uname -m)" -R ./build/test/runUnitTests
        else
          ctest --test-dir build --output-on-failure
        fi

  package:
    name: package and downstream use
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install and use with find_package
      run: |
        cmake -B build -DLITTLE_CACHE_BUILD_TESTS=OFF
        cmake --install build --prefix "$RUNNER_TEMP/prefix"
        mkdir consumer
        printf '%s\n' 'cmake_minimum_required(VERSION 3.20)' 'project(consumer CXX)' \
                      'find_package(little_cache 1.1 REQUIRED)' 'add_executable(consumer main.cpp)' \
                      'target_link_libraries(consumer PRIVATE little_cache::little_cache)' > consumer/CMakeLists.txt
        printf '%s\n' '#include <vector>' '#include <little_cache/little_cache.h>' \
                      'int main() { return little_cache<std::vector<char>>::get() ? 0 : 1; }' > consumer/main.cpp
        cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
        cmake --build consumer/build
        ./consumer/build/consumer
